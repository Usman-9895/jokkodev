# Point d'entrée HTTPS de JokkoDev (nginx, licence BSD-2-Clause).
# Remplacer jokkodev.example et les chemins de certificats. /api/v1 va à NestJS, le reste à Next.js ;
# les ports 3000 et 3001 n'écoutent que sur 127.0.0.1 et ne sont jamais exposés.

limit_req_zone $binary_remote_addr zone=jokkodev_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jokkodev.example;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jokkodev.example;

    ssl_certificate     /etc/letsencrypt/live/jokkodev.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jokkodev.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Corps JSON limité à 64 Kio par NestJS ; marge pour les en-têtes multipart éventuels du frontend.
    client_max_body_size 128k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Remplace tout X-Forwarded-For fourni par le client : NestJS (TRUST_PROXY=127.0.0.1) lit l'adresse réelle.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location /api/docs { return 404; }

    # Avatar uniquement : fichier 2 Mio + enveloppe multipart bornée. JSON reste à 64 Kio côté API.
    location = /api/v1/users/me/photo {
        client_max_body_size 2112k;
        limit_req zone=jokkodev_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
    }

    location /api/v1/ {
        limit_req zone=jokkodev_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
